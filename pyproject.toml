[project]
name = "bounded-normal-mean-certificate"
version = "0.2.0"
description = "Deterministic adaptive-support computation and independent certificates for the bounded normal mean problem"
license = {text = "GPL-3.0-or-later"}
requires-python = ">=3.11"
dependencies = [
    "numpy==2.3.2",
    "pillow==12.3.0",
    "python-flint==0.9.0",
]

[dependency-groups]
dev = ["pytest==9.1.1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv]
package = false
